<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database de Itens — GF Nexus</title>
  <meta name="description" content="Banco de dados de itens do GF Nexus — busque itens, ícones e IDs do servidor.">
  <meta name="robots" content="noindex,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="theme-color" content="#081428">

  <style>
    .db-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 64px; }
    .db-head { text-align: center; margin-bottom: 22px; }
    .db-head h1 { font-family: 'Cinzel', serif; font-size: 1.9rem; margin: 0 0 6px; color: #eaf1ff; }
    .db-head p { color: #9fb2d4; font-size: .95rem; margin: 0; }
    .db-search { max-width: 560px; margin: 0 auto 8px; display: flex; gap: 10px; }
    .db-search input {
      flex: 1; box-sizing: border-box; padding: 13px 16px; font-size: 1rem; font-family: inherit;
      background: rgba(8,16,32,.85); border: 1px solid rgba(120,160,220,.22); border-radius: 11px; color: #eaf1ff;
    }
    .db-search input:focus { outline: none; border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,.18); }
    .db-count { text-align: center; color: #8aa0c4; font-size: .84rem; margin-bottom: 20px; }
    .db-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .db-card {
      display: flex; gap: 12px; align-items: center; padding: 11px 13px;
      background: linear-gradient(180deg, rgba(18,30,54,.85), rgba(10,20,40,.85));
      border: 1px solid rgba(120,160,220,.16); border-radius: 12px; transition: border-color .12s, transform .12s;
    }
    .db-card:hover { border-color: rgba(120,160,220,.42); transform: translateY(-2px); }
    .db-ic { width: 44px; height: 44px; flex: none; border-radius: 8px; background: rgba(8,16,32,.6);
      image-rendering: pixelated; object-fit: contain; }
    .db-meta { min-width: 0; }
    .db-name { color: #eaf1ff; font-size: .92rem; font-weight: 600; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .db-id { color: #7e93b8; font-size: .76rem; margin-top: 3px; }
    .db-id b { color: #9fb2d4; font-family: ui-monospace, monospace; }
    .db-empty { text-align: center; color: #8aa0c4; padding: 40px 0; }
    .db-more { text-align: center; margin-top: 22px; }
  </style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html" aria-label="GF Nexus">
      <span class="brand-text"><img src="assets/img/logo.png" class="brand-logo" alt="GF Nexus"></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="database.html">Database</a>
      <a href="alquimia.html">Alquimia</a>
      <a href="noticias.html">Notícias</a>
      <a href="conta.html">Minha conta</a>
    </nav>
    <div class="nav-cta"><a class="btn btn-ghost" href="conta.html">Minha conta</a></div>
  </div>
</header>

<main class="db-wrap">
  <div class="db-head">
    <h1>Database de Itens</h1>
    <p>Busque por nome ou ID. Ícones e nomes direto do servidor do GF Nexus.</p>
  </div>
  <div class="db-search">
    <input type="search" id="q" placeholder="Buscar item por nome ou ID…" autocomplete="off" spellcheck="false">
  </div>
  <div class="db-count" id="count">Carregando itens…</div>
  <div class="db-grid" id="grid"></div>
  <div class="db-more"><button class="btn btn-ghost" id="more" style="display:none">Mostrar mais</button></div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/img/logo.png" class="brand-logo brand-logo-footer" alt="GF Nexus"></div>
    <p class="footer-legal"><a href="termos.html" style="color:#8aa0c4">Termos de Uso e Compras</a> &middot; GF Nexus — projeto de fã. Grand Fantasia é marca de seus respectivos donos.</p>
  </div>
</footer>

<script src="assets/js/items-db.js?v=2"></script>
<script>
(function () {
  // login-gated
  if (!localStorage.getItem("gfnexus_token")) { location.replace("login.html"); return; }

  var PAGE = 120;
  var grid = document.getElementById("grid"), countEl = document.getElementById("count");
  var qEl = document.getElementById("q"), moreBtn = document.getElementById("more");
  var filtered = [], shown = 0;

  function render(reset) {
    if (reset) { grid.innerHTML = ""; shown = 0; }
    var frag = document.createDocumentFragment();
    var end = Math.min(shown + PAGE, filtered.length);
    for (var i = shown; i < end; i++) {
      var it = filtered[i];
      var card = document.createElement("div"); card.className = "db-card";
      card.innerHTML =
        (it.ic ? '<img class="db-ic" loading="lazy" src="' + GFItems.iconUrl(it.ic) + '" alt="" onerror="this.style.visibility=\'hidden\'">'
               : '<div class="db-ic"></div>') +
        '<div class="db-meta"><div class="db-name">' + GFItems.esc(it.n) + '</div>' +
        '<div class="db-id">ID <b>' + it.id + '</b></div></div>';
      frag.appendChild(card);
    }
    grid.appendChild(frag); shown = end;
    moreBtn.style.display = shown < filtered.length ? "" : "none";
    countEl.textContent = filtered.length
      ? ("Mostrando " + shown + " de " + filtered.length.toLocaleString("pt-BR") + " itens")
      : "Nenhum item encontrado.";
    if (!filtered.length) grid.innerHTML = '<div class="db-empty">Nada encontrado. Tente outro termo.</div>';
  }

  function search(q) {
    filtered = GFItems.search(q);
    render(true);
  }

  var t;
  qEl.addEventListener("input", function () { clearTimeout(t); t = setTimeout(function () { search(qEl.value); }, 160); });
  moreBtn.addEventListener("click", function () { render(false); });

  GFItems.load().then(function () { search(""); }).catch(function () {
    countEl.textContent = "Não foi possível carregar o database. Recarregue a página.";
  });
})();
</script>
</body>
</html>
