<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — GF Nexus</title>
  <meta name="description" content="Acesse sua conta GF Nexus para gerenciar seus Nexus Points e seus personagens.">
  <meta name="robots" content="noindex,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <meta name="theme-color" content="#081428">

  <style>
    .reg-wrap { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
    .reg-card {
      width: 100%; max-width: 420px;
      background: linear-gradient(180deg, rgba(18,30,54,.92), rgba(10,20,40,.92));
      border: 1px solid rgba(120,160,220,.18);
      border-radius: 16px; padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .reg-card h1 { font-family: 'Cinzel', serif; font-size: 1.7rem; margin: 0 0 6px; color: #eaf1ff; }
    .reg-card .sub { color: #9fb2d4; font-size: .94rem; margin: 0 0 26px; }
    .reg-field { margin-bottom: 18px; }
    .reg-field label { display: block; font-size: .82rem; font-weight: 600; color: #b9c8e6; margin-bottom: 7px; letter-spacing: .02em; }
    .reg-field input {
      width: 100%; box-sizing: border-box; padding: 12px 14px;
      background: rgba(8,16,32,.85); border: 1px solid rgba(120,160,220,.22);
      border-radius: 9px; color: #eaf1ff; font-size: .98rem; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .reg-field input:focus { outline: none; border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,.18); }
    .reg-msg { display: none; padding: 11px 14px; border-radius: 9px; font-size: .9rem; margin-bottom: 18px; }
    .reg-msg.show { display: block; }
    .reg-msg.error { background: rgba(220,70,70,.14); border: 1px solid rgba(220,70,70,.4); color: #ffb4b4; }
    .reg-foot { text-align: center; margin-top: 18px; font-size: .86rem; color: #8aa0c4; }
    .reg-foot a { color: #6ea6ff; text-decoration: none; }
    .reg-foot .sep { color: #46587c; margin: 0 8px; }
    .btn[disabled] { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html" aria-label="GF Nexus">
      <span class="brand-text"><img src="assets/img/logo.png" class="brand-logo" alt="GF Nexus"></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="sobre.html">Sobre</a>
      <a href="guia.html">Guias</a>
      <a href="index.html#classes">Classes</a>
      <a href="index.html#roadmap">Roadmap</a>
      <a href="index.html#comunidade">Comunidade</a>
      <a href="noticias.html">Notícias</a>
      <a href="recrutamento.html">Recrutamento</a>
      <a href="index.html#faq">FAQ</a>
    </nav>
    <div class="nav-cta">      <a class="btn btn-primary" href="registrar.html">Criar conta</a>
    </div>
  </div>
</header>

<main class="reg-wrap">
  <div class="reg-card">
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta para gerenciar Nexus Points e personagens.</p>

    <div class="reg-msg" id="msg" role="alert"></div>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="reg-field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" maxlength="20" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="reg-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" maxlength="32" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn">Entrar</button>
    </form>

    <p class="reg-foot">
      <a href="recuperar-senha.html">Esqueci minha senha</a>
      <span class="sep">·</span>
      <a href="registrar.html">Criar conta</a>
    </p>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <img src="assets/img/logo.png" class="brand-logo brand-logo-footer" alt="GF Nexus">
    </div>
    <p class="footer-legal">GF Nexus — projeto de fã, sem fins lucrativos. Grand Fantasia é marca de seus respectivos donos.</p>
  </div>
</footer>

<script>
(function () {
  var API = "https://api.gf-nexus.com/api/v1/auth/login";
  var form = document.getElementById("loginForm");
  var btn  = document.getElementById("btn");
  var msgEl = document.getElementById("msg");

  // já logado? vai direto pra conta
  if (localStorage.getItem("gfnexus_token")) { location.replace("conta.html"); return; }

  function showMsg(text) { msgEl.textContent = text; msgEl.className = "reg-msg show error"; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    msgEl.className = "reg-msg";
    var username = document.getElementById("username").value.trim().toLowerCase();
    var password = document.getElementById("password").value;
    if (!username || !password) { return showMsg("Informe usuário e senha."); }

    btn.disabled = true; btn.textContent = "Entrando...";

    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, status: res.status, data: d }; }); })
      .then(function (r) {
        if (r.ok && r.data.access_token) {
          localStorage.setItem("gfnexus_token", r.data.access_token);
          localStorage.setItem("gfnexus_role", r.data.role || "player");
          location.replace("conta.html");
        } else if (r.status === 401) {
          showMsg("Usuário ou senha incorretos.");
        } else if (r.status === 403) {
          showMsg(r.data && r.data.detail ? r.data.detail : "Conta suspensa ou banida.");
        } else {
          showMsg("Não foi possível entrar. Tente novamente.");
        }
      })
      .catch(function () { showMsg("Não foi possível conectar ao servidor. Tente novamente."); })
      .finally(function () { btn.disabled = false; btn.textContent = "Entrar"; });
  });
})();
</script>
</body>
</html>
